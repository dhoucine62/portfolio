name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Vérifier et compiler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_BASE_PATH: /
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier TypeScript et compiler le site
        run: npm run build

      - name: Préparer le site pour GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Publier sur GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
